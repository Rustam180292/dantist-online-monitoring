<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aloqa yo'q — Logoped CRM</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f8fafc; color: #0f172a; padding: 24px;
      }
      .card {
        max-width: 360px; text-align: center; background: #fff; border-radius: 16px;
        padding: 28px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
      }
      .logo {
        width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 16px;
        background: linear-gradient(135deg,#6366f1,#4338ca); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; font-weight: 800;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; color: #64748b; margin: 0 0 20px; line-height: 1.5; }
      button {
        background: #4f46e5; color: #fff; border: 0; border-radius: 10px;
        padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #020617; color: #f1f5f9; }
        .card { background: #0f172a; }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">L</div>
      <h1>Internet aloqasi yo'q</h1>
      <p>
        Ma'lumotlar serverda saqlanadi, shuning uchun ularni ko'rish uchun aloqa kerak.
        Aloqa tiklangach qaytadan urinib ko'ring.
      </p>
      <button onclick="location.reload()">Qaytadan urinish</button>
    </div>
  </body>
</html>
